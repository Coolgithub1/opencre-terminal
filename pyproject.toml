[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opencre-terminal"
version = "0.2.0"
description = "Static-first, deterministic commercial real estate intelligence terminal"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "duckdb>=1.2,<2",
  "numpy>=2.0,<3",
  "polars>=1.0,<2",
  "pyarrow>=19,<24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
