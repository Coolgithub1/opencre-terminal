name: Fetch public RSS metadata

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python scripts/run_rss_pipeline.py --output-dir rss-output
      - uses: actions/upload-artifact@v4
        with:
          name: rss-metadata
          path: rss-output
          retention-days: 7
